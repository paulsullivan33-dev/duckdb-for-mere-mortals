site_name: DuckDB for Mere Mortals
site_description: Plain-language analytical SQL over files you already have. Querying CSV, JSON, and Parquet in place with DuckDB, schema guesses and their traps, joins across files, aggregates and window functions, writing results out, and the honest line between an embedded engine and a database server, practised on specimen data with known answers.
site_url: https://paulsullivan33-dev.github.io/duckdb-for-mere-mortals/
